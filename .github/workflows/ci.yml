name: CI
on:
  push:
  pull_request:
jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci || npm i
      - run: npm run build
      # spec-repo is the glTF spec fork carrying the KHR_audio_graph schemas
      # (kept out of this repo; validators read schemas from it).
      - run: git clone --depth 1 --branch codex/update-khr-audio-graph-only https://github.com/facebook/glTF.git spec-repo
      - run: npm run spec:validate
      - run: npm run example:compare-khr
      - run: npm run example:compare-khr:strict
