name: CI
on:
  push:
  pull_request:
jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci || npm i
      - run: npm run build
      - run: npm run spec:validate
      - run: npm run example:compare-khr
      - run: npm run example:compare-khr:strict
